<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question Bank</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <h1 class="logo">📚 Question Bank</h1>
            <div class="header-controls">
                <button id="langToggle" class="lang-toggle">EN</button>
            </div>
        </div>
    </header>

    <!-- Main content -->
    <main class="container">
        <!-- Welcome screen -->
        <div id="welcomeScreen" class="screen active">
            <h2 id="welcomeTitle"></h2>
            <p id="welcomeDesc"></p>
            <div class="subject-grid" id="subjectGrid"></div>
        </div>

        <!-- Lab selection screen -->
        <div id="labScreen" class="screen">
            <button class="btn-back" id="backFromLabs">← <span id="backText"></span></button>
            <h2 id="labTitle"></h2>
            <p class="lab-subtitle">Лабораторные работы</p>
            <div class="lab-grid" id="labGrid"></div>
        </div>

        <!-- Questions screen -->
        <div id="questionsScreen" class="screen">
            <button class="btn-back" id="backFromQuestions">← <span id="backText2"></span></button>
            <h2 id="questionsTitle"></h2>
            
            <div class="questions-header">
                <button class="btn-primary" id="addQuestionBtn">➕ <span id="addButtonText"></span></button>
                <button class="btn-secondary" id="addGoogleFormBtn" disabled title="Coming soon">
                    📋 <span id="googleFormText"></span>
                </button>
            </div>

            <div id="questionsList" class="questions-list"></div>
            <div id="loadingSpinner" class="loading" style="display: none;">
                <div class="spinner"></div>
                <p id="loadingText"></p>
            </div>
            <div id="errorMessage" class="error-message" style="display: none;"></div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p id="footerText"></p>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
